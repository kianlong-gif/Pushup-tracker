<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pushup Tracker</title>
  <!-- PWA Meta Tags for iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pushups">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; -webkit-tap-highlight-color: transparent; }
    .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px; margin-top: 10px; }
    .card { background: var(--card); border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
    .progress-circle { position: relative; width: 160px; height: 160px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; }
    .progress-circle svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .progress-circle circle { fill: none; stroke-width: 12; stroke-linecap: round; }
    .bg-circle { stroke: #334155; }
    .fg-circle { stroke: var(--accent); stroke-dasharray: 440; stroke-dashoffset: 440; transition: stroke-dashoffset 0.5s ease; }
    .stat-overlay { position: absolute; display: flex; flex-direction: column; align-items: center; }
    .stat-overlay .number { font-size: 2.5rem; font-weight: 800; color: var(--text); }
    .stat-overlay .label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    button { background: var(--accent); color: #0f172a; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: transform 0.1s, background 0.2s; }
    button:active { transform: scale(0.96); }
    .btn-secondary { background: #334155; color: var(--text); }
    .timer-display { font-size: 2rem; font-weight: 700; color: var(--accent); margin: 10px 0; }
    .history-list { list-style: none; text-align: left; max-height: 180px; overflow-y: auto; margin-top: 10px; }
    .history-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #334155; font-size: 0.95rem; }
    .history-item:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Main Progress Card -->
    <div class="card">
      <div class="progress-circle">
        <svg>
          <circle class="bg-circle" cx="80" cy="80" r="70"></circle>
          <circle id="progress" class="fg-circle" cx="80" cy="80" r="70"></circle>
        </svg>
        <div class="stat-overlay">
          <span id="current-count" class="number">0</span>
          <span class="label">/ <span id="goal-display">50</span> Reps</span>
        </div>
      </div>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Tap to log completed set</p>
      <div class="buttons">
        <button onclick="addReps(5)">+5</button>
        <button onclick="addReps(10)">+10</button>
        <button onclick="addReps(20)">+20</button>
      </div>
    </div>

    <!-- Rest Timer Card -->
    <div class="card">
      <p style="color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase;">Rest Timer</p>
      <div id="timer" class="timer-display">01:00</div>
      <div class="buttons" style="grid-template-columns: 1fr 1fr;">
        <button onclick="startTimer(60)" class="btn-secondary">Start 60s</button>
        <button onclick="resetTimer()" class="btn-secondary">Reset</button>
      </div>
    </div>

    <!-- History Card -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 1rem;">Today's Sets</h3>
        <button onclick="clearData()" style="padding: 4px 8px; font-size: 0.75rem; background: #ef4444; color: white;">Reset Day</button>
      </div>
      <ul id="history" class="history-list"></ul>
    </div>
  </div>

  <script>
    let count = parseInt(localStorage.getItem('pushup_count') || '0');
    let goal = 50;
    let history = JSON.parse(localStorage.getItem('pushup_history') || '[]');
    let timerInterval = null;

    function updateUI() {
      document.getElementById('current-count').innerText = count;
      const circle = document.getElementById('progress');
      const circumference = 2 * Math.PI * 70;
      const offset = circumference - Math.min(count / goal, 1) * circumference;
      circle.style.strokeDashoffset = offset;

      const historyEl = document.getElementById('history');
      historyEl.innerHTML = history.length === 0 ? '<li style="color: var(--text-muted); padding: 10px 0;">No sets logged today.</li>' : '';
      history.slice().reverse().forEach(item => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `<span>+${item.reps} pushups</span><span style="color: var(--text-muted);">${item.time}</span>`;
        historyEl.appendChild(li);
      });
    }

    function addReps(n) {
      count += n;
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      history.push({ reps: n, time: timeStr });
      localStorage.setItem('pushup_count', count);
      localStorage.setItem('pushup_history', JSON.stringify(history));
      updateUI();
      startTimer(60);
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      let remaining = seconds;
      const timerEl = document.getElementById('timer');
      
      const render = () => {
        const m = String(Math.floor(remaining / 60)).padStart(2, '0');
        const s = String(remaining % 60).padStart(2, '0');
        timerEl.innerText = `${m}:${s}`;
      };

      render();
      timerInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(timerInterval);
          timerEl.innerText = "00:00";
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        } else {
          render();
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      document.getElementById('timer').innerText = "01:00";
    }

    function clearData() {
      if (confirm("Reset today's pushup count?")) {
        count = 0;
        history = [];
        localStorage.removeItem('pushup_count');
        localStorage.removeItem('pushup_history');
        updateUI();
      }
    }

    updateUI();
  </script>
</body>
</html>
