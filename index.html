<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pushup Champions AI</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- MediaPipe & Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --accent: #38bdf8;
      --text: #f8fafc; --text-muted: #94a3b8; --success: #22c55e;
      --warning: #f59e0b; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; padding-bottom: 90px; -webkit-tap-highlight-color: transparent; }
    .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border-radius: 20px; padding: 18px; text-align: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); position: relative; }
    
    /* Header Auth Bar */
    .header-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px 16px; border-radius: 16px; width: 100%; }
    .user-profile { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 0.9rem; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #334155; }
    .streak-badge { background: #334155; color: var(--accent); padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; }

    /* Mode Selector Pills */
    .mode-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #0f172a; padding: 4px; border-radius: 14px; }
    .mode-btn { background: transparent; color: var(--text-muted); border: none; padding: 10px 4px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .mode-btn.active { background: var(--card); color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

    /* Camera Feed */
    .camera-container { position: relative; width: 100%; height: 220px; background: #000; border-radius: 16px; overflow: hidden; }
    video { display: none; }
    canvas { width: 100%; height: 100%; object-fit: cover; }
    .hud-overlay { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-badge { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }

    /* Rep Display */
    .rep-display { font-size: 3.5rem; font-weight: 900; color: var(--text); line-height: 1; margin: 10px 0; }
    .rep-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

    /* Badges */
    .badge-verified { background: rgba(34, 197, 94, 0.2); color: var(--success); padding: 2px 6px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; }
    .badge-manual { background: rgba(148, 163, 184, 0.2); color: var(--text-muted); padding: 2px 6px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; }

    /* Leaderboard Tabs */
    .tab-header { display: flex; gap: 10px; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 12px; }
    .tab-btn { background: none; border: none; color: var(--text-muted); font-size: 0.85rem; font-weight: 700; cursor: pointer; padding: 4px 8px; }
    .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    .lb-list { list-style: none; max-height: 180px; overflow-y: auto; text-align: left; }
    .lb-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #334155; font-size: 0.85rem; }

    /* Realtime Drawer */
    .drawer { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -5px 25px rgba(0,0,0,0.5); transform: translateY(calc(100% - 45px)); transition: transform 0.3s ease; max-width: 440px; margin: 0 auto; z-index: 100; }
    .drawer.open { transform: translateY(0); }
    .drawer-handle { height: 45px; width: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-weight: 700; font-size: 0.85rem; color: var(--accent); background: transparent; border: none; }
    .drawer-content { padding: 0 16px 20px; max-height: 220px; overflow-y: auto; }

    /* Buttons */
    button { background: var(--accent); color: #0f172a; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; -webkit-appearance: none; }
    button:active { transform: scale(0.96); opacity: 0.9; }
    .btn-secondary { background: #334155; color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- Header / Auth -->
    <div class="header-bar">
      <div class="user-profile">
        <img id="user-avatar" class="avatar" src="https://via.placeholder.com/32" alt="Avatar">
        <span id="user-name">Guest User</span>
      </div>
      <div class="streak-badge"><span id="user-streak">0</span> Day Streak</div>
      <button id="auth-btn" onclick="toggleAuth()" class="btn-secondary" style="padding: 6px 12px; font-size: 0.75rem;">Login GitHub</button>
    </div>

    <!-- Workout Mode Selector -->
    <div class="mode-selector">
      <button class="mode-btn active" onclick="setMode('standard', event)">Standard</button>
      <button class="mode-btn" onclick="setMode('blitz', event)">60s Blitz</button>
      <button class="mode-btn" onclick="setMode('amrap', event)">AMRAP</button>
    </div>

    <!-- Camera Card -->
    <div class="card">
      <div class="camera-container">
        <video id="webcam" playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
        <div class="hud-overlay">
          <div id="status-hud" class="hud-badge">Camera Off</div>
          <div id="timer-hud" class="hud-badge" style="color: var(--accent);">00:00</div>
        </div>
      </div>
      <div style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
        <button id="camera-btn" onclick="toggleCamera()" style="flex: 2;">Start AI Camera</button>
        <button onclick="addManualRep()" class="btn-secondary" style="flex: 1;">+1 Manual</button>
        <button onclick="finishWorkoutSet()" style="flex: 100%; background: #22c55e; color: #0f172a; margin-top: 4px;">Finish & Save Set</button>
      </div>
    </div>

    <!-- Active Set Stats -->
    <div class="card" style="padding: 12px;">
      <div class="rep-label">Current Workout Reps</div>
      <div id="rep-count" class="rep-display">0</div>
      <div id="mode-desc" style="font-size: 0.8rem; color: var(--text-muted);">Mode: Standard Free Reps</div>
    </div>

    <!-- Leaderboards Card -->
    <div class="card">
      <div class="tab-header">
        <button class="tab-btn active" onclick="switchTab('champions', event)">All-Time</button>
        <button class="tab-btn" onclick="switchTab('blitz_max', event)">60s Blitz</button>
      </div>
      <ul id="lb-list" class="lb-list">
        <li style="color: var(--text-muted); font-size: 0.85rem;">Loading rankings...</li>
      </ul>
    </div>

  </div>

  <!-- Real-Time Activity Drawer -->
  <div id="drawer" class="drawer">
    <button class="drawer-handle" onclick="toggleDrawer()">Live Activity Feed (<span id="feed-count">0</span>)</button>
    <div class="drawer-content">
      <ul id="live-feed" class="lb-list">
        <li style="color: var(--text-muted); font-size: 0.8rem;">Listening for live sets...</li>
      </ul>
    </div>
  </div>

  <script>
    // --- PASTE YOUR SUPABASE KEYS HERE ---
    const SUPABASE_URL = "https://vflqdmwdynpsxagmrpmw.supabase.co";
    // NOTE: Make sure your key is fully pasted inside the quotes below
    const SUPABASE_ANON_KEY = "sb_publishable_cbQNTilH9HHJKBPIOjLiwQ_zUKLM-Pa";

    // --- GLOBAL VARIABLES ---
    let supabaseClient = null;
    let audioCtx = null;
    let currentMode = 'standard';
    let currentReps = 0;
    let repStage = 'UP';
    let isCameraRunning = false;
    let timerInterval = null;
    let modeTimerSeconds = 0;
    let user = null;
    let lastRepTime = 0;
    let downPhaseStartTime = 0;
    let pose = null;

    // --- LAZY AUDIO INITIALIZATION (MOBILE SAFE) ---
    function playBeep(freq, type = 'sine', duration = 0.08) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn("Audio Context error:", e);
      }
    }
    const playDownBeep = () => playBeep(350, 'sine', 0.08);
    const playUpBeep = () => playBeep(750, 'triangle', 0.12);

    // --- SAFE INITIALIZATION ---
    window.onload = async () => {
      try {
        if (window.supabase && SUPABASE_URL.startsWith("http")) {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          
          const { data: { session } } = await supabaseClient.auth.getSession();
          if (session && session.user) {
            user = session.user;
            updateUserUI();
          }

          supabaseClient.auth.onAuthStateChange((_event, session) => {
            if (session && session.user) {
              user = session.user;
              updateUserUI();
            }
          });

          loadLeaderboard('champions');
          loadLiveFeed();
        }
      } catch (err) {
        console.error("Supabase init error:", err);
      }
    };

    function updateUserUI() {
      if (!user) return;
      const name = user.user_metadata.user_name || user.user_metadata.preferred_username || user.user_metadata.full_name || 'Athlete';
      const avatar = user.user_metadata.avatar_url || 'https://via.placeholder.com/32';
      document.getElementById('user-name').innerText = name;
      document.getElementById('user-avatar').src = avatar;
      document.getElementById('auth-btn').innerText = 'Logout';
    }

    // --- WORKOUT LOGIC ---
    window.setMode = function(mode, e) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      if (e && e.target) e.target.classList.add('active');
      resetWorkout();

      const descMap = {
        standard: 'Mode: Standard Free Reps',
        blitz: 'Mode: 60-Second Blitz (Max reps before clock runs out)',
        amrap: 'Mode: AMRAP (As Many Reps As Possible)'
      };
      document.getElementById('mode-desc').innerText = descMap[mode];
    };

    function resetWorkout() {
      currentReps = 0;
      repStage = 'UP';
      clearInterval(timerInterval);
      timerInterval = null;
      modeTimerSeconds = currentMode === 'blitz' ? 60 : 0;
      document.getElementById('rep-count').innerText = '0';
      document.getElementById('timer-hud').innerText = currentMode === 'blitz' ? '01:00' : '00:00';
    }

    function startModeTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        if (currentMode === 'blitz') {
          modeTimerSeconds--;
          const s = String(modeTimerSeconds % 60).padStart(2, '0');
          document.getElementById('timer-hud').innerText = `00:${s}`;
          if (modeTimerSeconds <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            finishWorkoutSet();
          }
        } else {
          modeTimerSeconds++;
          const m = String(Math.floor(modeTimerSeconds / 60)).padStart(2, '0');
          const s = String(modeTimerSeconds % 60).padStart(2, '0');
          document.getElementById('timer-hud').innerText = `${m}:${s}`;
        }
      }, 1000);
    }

    function recordRep(isVerified = true) {
      if (currentMode === 'blitz' && modeTimerSeconds <= 0) return;
      if (!timerInterval && currentMode !== 'standard') startModeTimer();

      currentReps++;
      document.getElementById('rep-count').innerText = currentReps;
      playUpBeep();

      if (isVerified && navigator.vibrate) navigator.vibrate(80);
    }

    window.addManualRep = function() {
      recordRep(false);
    };

    window.finishWorkoutSet = async function() {
      if (currentReps <= 0) {
        alert("Do at least 1 rep before saving!");
        return;
      }
      if (!user) {
        alert("Please click 'Login GitHub' at the top before saving your set!");
        return;
      }

      await saveSetToSupabase(currentReps, currentMode, true);
      loadLeaderboard('champions');
      resetWorkout();
    };

    // --- LEADERBOARDS ---
    async function loadLeaderboard(type) {
      const lbEl = document.getElementById('lb-list');
      if (!supabaseClient) return;

      try {
        let { data, error } = await supabaseClient.from('workout_sets').select('username, reps, is_verified, mode');
        if (error) throw error;

        if (!data || data.length === 0) {
          lbEl.innerHTML = '<li style="color: var(--text-muted); font-size: 0.85rem;">No sets logged yet. Be the first!</li>';
          return;
        }

        lbEl.innerHTML = '';
        if (type === 'champions') {
          const totals = {};
          data.forEach(item => {
            if (!totals[item.username]) totals[item.username] = { reps: 0, verified: item.is_verified };
            totals[item.username].reps += item.reps;
          });
          const sorted = Object.entries(totals).sort((a,b) => b[1].reps - a[1].reps).slice(0, 10);
          sorted.forEach(([name, info], idx) => {
            const badge = info.verified ? '<span class="badge-verified">Verified</span>' : '<span class="badge-manual">Manual</span>';
            lbEl.innerHTML += `<li class="lb-item"><span>#${idx+1} ${name} ${badge}</span><strong>${info.reps} reps</strong></li>`;
          });
        } else if (type === 'blitz_max') {
          const blitzSets = data.filter(d => d.mode === 'blitz').sort((a,b) => b.reps - a.reps).slice(0, 10);
          if (blitzSets.length === 0) {
            lbEl.innerHTML = '<li style="color: var(--text-muted); font-size: 0.85rem;">No 60s Blitz sets logged yet.</li>';
            return;
          }
          blitzSets.forEach((item, idx) => {
            const badge = item.is_verified ? '<span class="badge-verified">Verified</span>' : '<span class="badge-manual">Manual</span>';
            lbEl.innerHTML += `<li class="lb-item"><span>#${idx+1} ${item.username} ${badge}</span><strong>${item.reps} reps</strong></li>`;
          });
        }
      } catch (err) {
        lbEl.innerHTML = '<li style="color: var(--text-muted); font-size: 0.85rem;">Error loading leaderboard.</li>';
      }
    }

    async function loadLiveFeed() {
      if (!supabaseClient) return;
      try {
        const { data } = await supabaseClient.from('workout_sets').select('*').order('created_at', { ascending: false }).limit(10);
        if (data) renderFeedItems(data);

        supabaseClient.channel('public:workout_sets')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'workout_sets' }, payload => {
            prependFeedItem(payload.new);
          })
          .subscribe();
      } catch(e) { console.warn("Live feed error", e); }
    }

    function renderFeedItems(items) {
      const feedEl = document.getElementById('live-feed');
      feedEl.innerHTML = items.length === 0 ? '<li style="color: var(--text-muted); font-size: 0.8rem;">No recent activity.</li>' : '';
      items.forEach(item => {
        const badge = item.is_verified ? '<span class="badge-verified">Verified</span>' : '<span class="badge-manual">Manual</span>';
        feedEl.innerHTML += `<li class="lb-item"><span>${item.username} logged ${item.reps} reps (${item.mode.toUpperCase()}) ${badge}</span></li>`;
      });
      document.getElementById('feed-count').innerText = items.length;
    }

    function prependFeedItem(item) {
      const feedEl = document.getElementById('live-feed');
      const badge = item.is_verified ? '<span class="badge-verified">Verified</span>' : '<span class="badge-manual">Manual</span>';
      const li = document.createElement('li');
      li.className = 'lb-item';
      li.innerHTML = `<span>${item.username} logged ${item.reps} reps (${item.mode.toUpperCase()}) ${badge}</span>`;
      feedEl.prepend(li);
      const current = parseInt(document.getElementById('feed-count').innerText || '0');
      document.getElementById('feed-count').innerText = current + 1;
    }

    // --- MEDIAPIPE CAMERA ---
    window.toggleCamera = function() {
      const btn = document.getElementById('camera-btn');
      const statusHud = document.getElementById('status-hud');

      if (!isCameraRunning) {
        try {
          if (!window.Pose) return alert("AI Pose library is still loading. Try again in a few seconds.");

          pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
          pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });

          const videoElement = document.getElementById('webcam');
          const canvasElement = document.getElementById('output_canvas');
          const canvasCtx = canvasElement.getContext('2d');

          pose.onResults((results) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
              const lm = results.poseLandmarks;
              const leftVis = (lm[11].visibility + lm[13].visibility + lm[15].visibility) / 3;
              const rightVis = (lm[12].visibility + lm[14].visibility + lm[16].visibility) / 3;
              const [shoulder, elbow, wrist] = leftVis > rightVis ? [lm[11], lm[13], lm[15]] : [lm[12], lm[14], lm[16]];

              if (shoulder.visibility > 0.5 && elbow.visibility > 0.5 && wrist.visibility > 0.5) {
                const radians = Math.atan2(wrist.y - elbow.y, wrist.x - elbow.x) - Math.atan2(shoulder.y - elbow.y, shoulder.x - elbow.x);
                let angle = Math.abs((radians * 180.0) / Math.PI);
                angle = angle > 180.0 ? 360.0 - angle : Math.round(angle);

                [shoulder, elbow, wrist].forEach(pt => {
                  canvasCtx.beginPath();
                  canvasCtx.arc(pt.x * canvasElement.width, pt.y * canvasElement.height, 5, 0, 2 * Math.PI);
                  canvasCtx.fillStyle = '#22c55e'; canvasCtx.fill();
                });

                if (angle < 90 && repStage === 'UP') {
                  repStage = 'DOWN';
                  downPhaseStartTime = Date.now();
                  playDownBeep();
                  statusHud.innerText = 'Position: DOWN';
                  statusHud.style.color = '#f59e0b';
                }

                if (angle > 155 && repStage === 'DOWN') {
                  const now = Date.now();
                  const timeInDownPhase = now - downPhaseStartTime;
                  const timeSinceLastRep = now - lastRepTime;

                  if (timeInDownPhase >= 120 && timeSinceLastRep >= 750) {
                    repStage = 'UP';
                    lastRepTime = now;
                    statusHud.innerText = 'Position: UP';
                    statusHud.style.color = '#22c55e';
                    recordRep(true);
                  }
                }
              }
            }
            canvasCtx.restore();
          });

          const cam = new Camera(videoElement, {
            onFrame: async () => { await pose.send({ image: videoElement }); },
            width: 640,
            height: 480
          });
          cam.start();

          isCameraRunning = true;
          btn.innerText = 'Stop Camera';
          statusHud.innerText = 'Position: Ready';
        } catch (err) {
          alert("Could not start camera: " + err.message);
        }
      } else {
        location.reload();
      }
    };

    // --- AUTH & HELPERS ---
    window.toggleAuth = async function() {
      if (!supabaseClient) return alert("Supabase is not connected!");
      if (user) {
        await supabaseClient.auth.signOut();
        location.reload();
      } else {
        await supabaseClient.auth.signInWithOAuth({
          provider: 'github',
          options: { redirectTo: window.location.origin + window.location.pathname }
        });
      }
    };

    async function saveSetToSupabase(reps, mode, isVerified) {
      if (!supabaseClient || !user) return;
      const username = user.user_metadata.user_name || user.user_metadata.preferred_username || user.user_metadata.full_name || 'Athlete';

      const { error } = await supabaseClient.from('workout_sets').insert({
        user_id: user.id,
        username: username,
        reps: reps,
        mode: mode,
        is_verified: isVerified
      });

      if (error) {
        alert("Database Error: " + error.message);
      } else {
        alert(`Successfully saved ${reps} reps!`);
      }
    }

    window.toggleDrawer = function() {
      document.getElementById('drawer').classList.toggle('open');
    };

    window.switchTab = function(tab, e) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (e && e.target) e.target.classList.add('active');
      loadLeaderboard(tab);
    };
  </script>
</body>
</html>
